<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SportSpace | Daftar Arena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    
    <header class="navbar navbar-expand-lg navbar-dark shadow-sm bg-aesthetic sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-controller me-1 text-warning"></i> SportSpace</a>
            <button id="nav-toggle-btn" class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item"><a class="nav-link fw-semibold" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="list.html">Daftar Arena</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Arena</a></li>
                    <li class="nav-item"><a class="nav-link" href="../member/list.html">Daftar Member</a></li>
                    <li class="nav-item"><a class="nav-link" href="../member/tambah.html">Tambah Member</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <section class="card border-0 rounded-4 shadow-sm bg-white overflow-hidden">
            <div class="text-white p-4" style="background: linear-gradient(135deg, #4A6054 0%, #6b8676 100%);">
                <h3 class="fw-bold m-0"><i class="bi bi-grid-1x2-fill me-2"></i>Katalog Arena</h3>
                <p class="mb-0 text-white-50 small">Kelola daftar lapangan dan meja permainan</p>
            </div>

            <div class="card-body p-4 p-md-5">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                    <div class="input-group bg-light rounded-pill" style="max-width: 350px;">
                        <span class="input-group-text bg-transparent border-0 text-secondary ps-4"><i class="bi bi-search"></i></span>
                        <input type="text" id="search-input" class="form-control bg-transparent border-0 shadow-none ps-2 py-2" placeholder="Cari arena...">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn bg-white border border-secondary-subtle text-secondary rounded-pill px-4 py-2 shadow-sm hover-lift fw-medium" onclick="muatDaftarArena()">
                            <i class="bi bi-arrow-clockwise me-1"></i> Muat Ulang
                        </button>
                        <a href="tambah.html" class="btn bg-aesthetic text-white rounded-pill px-4 py-2 shadow-sm hover-lift fw-medium">
                            <i class="bi bi-plus-lg me-1"></i> Tambah Arena
                        </a>
                    </div>
                </div>

                <p id="loading-indicator" class="text-center text-secondary my-4" style="display:none;"><i class="bi bi-arrow-repeat spin me-2"></i>Memuat data arena...</p>

                <div class="table-responsive rounded-3 border">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr style="background-color: #4A6054; color: white;">
                                <th class="py-3 px-3 border-0">ID ARENA</th>
                                <th class="py-3 px-3 border-0">NAMA LAPANGAN / MEJA</th>
                                <th class="py-3 px-3 border-0">KATEGORI</th>
                                <th class="py-3 px-3 border-0">HARGA / JAM</th>
                                <th class="py-3 px-3 border-0 text-center">STATUS</th>
                                <th class="py-3 px-3 border-0 text-center">AKSI</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Tbody sengaja kosong -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="mt-auto py-3 bg-white border-top text-center">
        <div class="container"><span class="text-secondary" style="font-size: 0.9rem;">&copy; 2026 SportSpace &mdash; Jobsheet 6</span></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/arena.js"></script>
</body>
</html>
